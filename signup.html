<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - MARSHAL X GAMING</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-box {
            width: 380px;
            background: #111;
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #292929;
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: red;
            font-size: 30px;
            letter-spacing: 2px;
        }

        .logo p {
            color: #888;
            margin-top: 8px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;

            background: #1b1b1b;
            color: white;

            border: 1px solid #444;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: red;
        }

        button {
            width: 100%;
            padding: 13px;

            background: red;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #cc0000;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #888;
        }

        .login a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .login a:hover {
            color: red;
        }
    </style>
</head>

<body>

    <div class="signup-box">

        <div class="logo">
            <h1>MARSHAL X</h1>
            <p>CREATE ACCOUNT</p>
        </div>

        <form id="signupForm">

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                placeholder="Choose a username"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >

            <label for="confirmPassword">Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
            >

            <button type="submit">
                SIGN UP
            </button>

        </form>

        <p id="message"></p>

        <div class="login">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>


    <script>

        const signupForm = document.getElementById("signupForm");

        signupForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message =
                document.getElementById("message");


            if (password !== confirmPassword) {

                message.textContent = "Passwords do not match!";
                message.style.color = "red";

                return;
            }


            localStorage.setItem("username", username);
            localStorage.setItem("password", password);


            message.textContent =
                "Account created successfully! 🎉";

            message.style.color = "lime";


            setTimeout(function() {

                window.location.href = "login.html";

            }, 1200);

        });

    </script>

</body>

</html>
